name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install ruff
      - run: ruff check --select E9,F63,F7,F82 .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: unit + integration + security regression
        run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install coverage
      - name: run under coverage (tests + scenario eval, subprocesses included)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests
          python -m coverage run qa/eval.py
          python -m coverage combine
      - name: per-module thresholds
        run: |
          python -m coverage report --include='*secret_scanner*'   --fail-under=95
          python -m coverage report --include='*audit_scan*'      --fail-under=90
          python -m coverage report --include='*gates*'           --fail-under=90
          python -m coverage report --include='*safe_clean*'      --fail-under=90
          python -m coverage report --include='*remediate*'       --fail-under=90
          python -m coverage report --include='*report_generator*' --fail-under=90
          python -m coverage report --include='*agents_doctor*' --fail-under=90
          python -m coverage report --fail-under=85

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema
      - run: python tools/validate_manifest.py
      - run: python tools/validate_schema.py llm-eval/fixtures/clean.json
      - run: python tools/validate_schema.py llm-eval/fixtures/chaos.json
      - run: python tools/check_links.py
      - run: python tools/gen_harness_matrix.py --check
      - name: references/glossary.md must match scripts/glossary.py
        run: python tools/gen_glossary.py --check
      - name: README facts must match the actual suite
        run: python tools/check_readme_facts.py --check

  secret-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: precision/recall floors
        run: python bench/secret_quality.py --out bench/SECRET-QUALITY-ci.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-quality-report
          path: bench/SECRET-QUALITY-ci.md

  self-audit:
    # dogfooding: agents-doctor audits its own repository. Report-only:
    # the repo legitimately contains a synthetic secret corpus in
    # tests/, so there is no --fail-on gate here; the SARIF artifact
    # shows what a consumer would see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: audit this repository
        run: |
          python skills/agents-doctor/scripts/agents_doctor.py audit . \
            --home "$HOME" --out self-scan.json
          python skills/agents-doctor/scripts/agents_doctor.py sarif \
            self-scan.json --out agents-doctor.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-audit-sarif
          path: |
            agents-doctor.sarif
            self-scan.json

  llm-eval-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: deterministic grading pipeline, no network, no API keys
        run: python llm-eval/run_eval.py --model offline

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python bench/gen_workspace.py bench/work/small --size small
      - run: python bench/run_benchmark.py bench/work/small --home bench/work/home --label "ci linux (small)" --max-wall 60
      - run: python bench/gen_workspace.py bench/work/medium --size medium
      - run: python bench/run_benchmark.py bench/work/medium --home bench/work/home --label "ci linux (medium)" --max-wall 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-linux
          path: bench/BENCH-*.md

  benchmark-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python bench/gen_workspace.py bench/work/small --size small
      - run: python bench/run_benchmark.py bench/work/small --home bench/work/home --label "ci windows (small)" --max-wall 10
      - run: python bench/gen_workspace.py bench/work/medium --size medium
      - run: python bench/run_benchmark.py bench/work/medium --home bench/work/home --label "ci windows (medium)" --max-wall 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-windows
          path: bench/BENCH-*.md

  ui-e2e:
    # browser E2E over the local UI server.
    # The playwright suite skips itself everywhere else; only this job
    # installs the browsers, so it is the one place the tests run.
    # Two passes: chromium (default) and firefox via AGENTS_E2E_BROWSER
    # (the channel is picked inside UiHarness from that env var).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium firefox
      - name: browser E2E — chromium
        run: python -m unittest tests.e2e.test_ui_e2e -v
      - name: browser E2E — firefox
        env:
          AGENTS_E2E_BROWSER: firefox
        run: python -m unittest tests.e2e.test_ui_e2e -v

  release:
    # full semver tags only (v3.0.1): moving major pointers (v3) run the
    # checks but must not mint releases
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    needs: [lint, tests, coverage, validate, secret-quality, llm-eval-offline, benchmark, benchmark-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests
      - run: python tools/validate_manifest.py
      - name: package zip from an explicit allowlist, then verify its contents
        run: |
          python - <<'EOF'
          import json, pathlib, zipfile
          root = pathlib.Path('.')
          ver = json.loads((root / '.claude-plugin/plugin.json').read_text())['version']
          out = f'agents-doctor-{ver}.zip'
          # allowlist: exactly what an installed plugin needs
          allow = ['.claude-plugin/plugin.json', 'marketplace.json', 'LICENSE',
                   'README.md', 'CHANGELOG.md']
          for pattern in ('commands/*', 'skills/**/*', 'docs/*.md',
                          'docs/*.json', 'docs/schema/*.json'):
              allow.extend(p.as_posix() for p in root.glob(pattern)
                           if p.is_file() and '__pycache__' not in p.parts)
          existing = [a for a in allow if (root / a).is_file()]
          missing = [a for a in allow if not (root / a).is_file()
                     and a not in ('CHANGELOG.md',)]
          assert not missing, 'allowlist references missing files: %s' % missing
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for a in existing:
                  z.write(root / a, a)
          # verify: zip contents == allowlist, no tests/bench/CI junk inside
          with zipfile.ZipFile(out) as z:
              names = set(z.namelist())
          assert names == set(existing), 'zip contents diverge from allowlist'
          banned = ('tests/', 'bench/', '.github/', 'llm-eval/', 'qa/',
                    'tools/', '.coveragerc', '.gitignore')
          assert not any(n.startswith(b) for n in names for b in banned), \
              'forbidden paths in the package'
          assert not any('__pycache__' in n or n.endswith('.pyc')
                         for n in names), 'bytecode in the package'
          print('packaged', out, len(names), 'files, allowlist verified')
          EOF
      - name: create release or attach the zip to an existing one
        # a manual UI publish (e.g. the Marketplace checkbox) may have
        # created the release first; then just deliver the zip
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" agents-doctor-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" agents-doctor-*.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
